#               - src: "https://youtu.be/VIDEO_ID" # YouTube link
#               - src: "/media/clip.mp4"           # video file (keep under ~50 MB)
#  topic:    which research topic the paper is listed under: the `id` of
#            a topic in _data/research.yml (e.g. "privacy").
