- title: "Feature learning under spectral optimizers"
  dates: "May 2026 – present"
  where: "University of Southern California · IUSSTF–Viterbi Scholar"
  with: "[Prof. Vatsal Sharan](https://vatsalsharan.github.io/)"
  summary: "Generalizing the Neural Feature Ansatz to Muon and spectral gradient descent: a whitened *SpecAGOP* tracks the learned features where the standard AGOP fails, and we are scaling this to GPT-2-style transformers. We also derive the AGOP as an optimal low-rank compression of the input and propose a covariance-weighted AGOP for non-isotropic data."

- title: "Memory–sample trade-offs for learning"
  dates: "May 2026 – present"
  where: "University of Southern California"
  with: "[Prof. Vatsal Sharan](https://vatsalsharan.github.io/) (USC), Prof. Kabir Verchand (USC), Prof. Ankit Pensia (CMU)"
  summary: "Memory–sample lower bounds for testing planted-matrix streaming problems; the general theorem recovers and strengthens prior bounds of Garg, Kothari and Raz (2020)."

