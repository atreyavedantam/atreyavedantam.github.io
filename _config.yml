# --- Build settings (no need to touch) --------------------------------
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - node_modules
  - media/.gitkeep
  - images/.gitkeep
