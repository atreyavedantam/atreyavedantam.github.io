- heading: "Positions of responsibility"
  items:
    - what: "Head, Mathematics Club, IIT Madras"
      detail: "Led a team of 70+, including 14 coordinators. Founded the Srinivasa Ramanujan Mathematics Competition, India’s first olympiad-style contest for engineering undergraduates, with 600+ registrations from 100+ universities in its first year. Ran the club’s Summer School (~1000 registrations from across India), oversaw two projects (*SnipperClips*, on building a target shape from two initial shapes with a fixed set of moves, and *Dynamix*, on modelling dynamical systems with category theory), and launched the club’s first website."
      when: "2023 – 25"
      media: []
    - what: "Coordinator, Mathematics Club, IIT Madras"
      detail: "Ran the Combino-Geo Grand Prix (200+ registrations, five rounds). Taught two sessions on optimization. Led a project on the travelling salesman problem that produced a heuristic a million times faster than simulated annealing. Made an animated Manim video explaining a mathematical idea visually."
      when: ""
      media: []
    - what: "Deputy Coordinator, Mathematics Club, IIT Madras"
      detail: "Organized IIT Madras’s first Integration Bee (150+ students). Used Monte Carlo simulation of a 2D particle model to estimate the temperature dependence in the Arrhenius equation, presented at the CFI Open House 2023."
      when: ""
      media: []
    - what: "Coordinator, AI Club, IIT Madras"
      detail: "Taught an online Summer School session introducing deep learning to 1000+ students across India, and sessions on optimization, quantum ML and neural networks from scratch to 200+ students. Ran a workshop on MLOps with Docker. Designed and ran the Shaastra Techathon AI/ML Challenge 2024 (350+ participants from 20+ colleges): problem statement, dataset and evaluation metric."
      when: "2024 – 25"
      media: []

