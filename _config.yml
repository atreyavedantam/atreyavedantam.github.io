# --- Top navigation: one tab per page ---------------------------------
# Each tab is its own page file in the repo root (index.md, news.md, …).
# Reorder the lines to reorder tabs; delete a line to hide a tab.
nav:
  - { title: "About",            url: "/" }
  - { title: "News",             url: "/news/" }
  - { title: "Publications",     url: "/publications/" }
  - { title: "Research",         url: "/research/" }
  - { title: "Teaching",         url: "/teaching/" }
  - { title: "Service",          url: "/service/" }
  - { title: "Extracurriculars", url: "/extracurriculars/" }

# How many news items to show before the "Show older news" toggle.
news_visible: 6

# --- Site metadata (browser tab, search engines, link previews) -------
